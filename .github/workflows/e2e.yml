name: e2e
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  install-and-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: docker/setup-buildx-action@v3
      - run: ./build/e2e.sh v9.6.0
      - name: Collect logs on failure
        if: failure()
        run: docker compose --project-directory .build/e2e -f .build/e2e/docker-compose.yml logs --no-color > e2e-logs.txt || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-logs, path: e2e-logs.txt }
