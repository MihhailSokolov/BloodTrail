name: ci
on:
  push: { branches: [main] }
  pull_request:
  # Only fires if the branch ruleset enables a merge queue, whose required
  # checks are reported for the queued merge commit by this trigger.
  merge_group:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: bloodtrail, POSTGRES_PASSWORD: bloodtrail, POSTGRES_DB: bloodtrail }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U bloodtrail" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # The integration tag is the repository's only build tag and it only
      # ever adds files, so this one run lints the untagged code as well as the
      # integration tests and fixtures the tag brings in. Without it those
      # files were never linted. Keep in step with `make lint`.
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.13.2, args: --build-tags integration }
      - run: go test -race ./...
      - run: go test -race -tags integration -count=1 -p 1 ./...
        env:
          BLOODTRAIL_TEST_PG: postgresql://bloodtrail:bloodtrail@127.0.0.1:55432/bloodtrail
      # bench/csrbench is its own module, invisible to the ./... patterns above.
      - name: csrbench module
        working-directory: bench/csrbench
        run: |
          go vet ./...
          go test ./...
      # The Python benchmark harnesses have tests of their own (standard library only).
      - name: benchmark harness tests
        run: make test-bench-scripts
      # build/build-image.sh's dawgs check and build/dawgs-suites.sh, against stand-ins for git, go and docker.
      - name: build script tests
        run: make test-build-scripts
  upstreams:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      # Every supported upstream release, derived from upstream's own release
      # list (build/upstream-tags.sh), so a new BloodHound release is guarded
      # from the next CI run on rather than whenever someone edits a list.
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        # Assigned before it is echoed: `echo "tags=$(cmd)"` reports echo's
        # status, so a failing upstream-tags.sh used to pass this step with an
        # empty list, and the matrix below then died on fromJson('').
        run: |
          tags=$(./build/upstream-tags.sh)
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
  patch-guard:
    needs: upstreams
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v9.6.0 is the e2e-validated tag; every supported published tag gets
        # at least this apply-check per change (see README "Upstream versions").
        upstream: ${{ fromJson(needs.upstreams.outputs.tags) }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply the patch to ${{ matrix.upstream }}
        run: |
          git clone --depth 1 --branch ${{ matrix.upstream }} https://github.com/SpecterOps/BloodHound.git /tmp/upstream
          git -C /tmp/upstream apply --check "$GITHUB_WORKSPACE/patches/bloodhound-driver.patch"
  # The images ship whatever dawgs build/build-image.sh resolves for each
  # supported upstream release: upstream's own pin, or the driver's when that is
  # higher. `test` runs the suites against the version go.mod names; v9.7.1 pins
  # a newer one, and its image shipped a dawgs no suite had ever run against.
  # This job runs them against every OTHER version the supported releases
  # resolve to, and fails for a release whose resolved dawgs differs from its
  # own pin without build-image.sh listing why (see build/README.md).
  dawgs:
    needs: upstreams
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: bloodtrail, POSTGRES_PASSWORD: bloodtrail, POSTGRES_DB: bloodtrail }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U bloodtrail" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: ./build/dawgs-suites.sh "$TAGS"
        env:
          TAGS: ${{ needs.upstreams.outputs.tags }}
          BLOODTRAIL_TEST_PG: postgresql://bloodtrail:bloodtrail@127.0.0.1:55432/bloodtrail
  # The one check the branch ruleset should require, instead of the jobs
  # above. It runs whatever they did (always()) and passes only if every one of
  # them succeeded. A ruleset counts a SKIPPED required job as passing, and a
  # job is skipped when something it needs failed, so requiring jobs by name
  # would let a broken upstream list through; requiring this one cannot. It
  # also survives a job being renamed or split (a matrix leg's check name is
  # its value). Add every new job to needs below.
  ci-ok:
    if: always()
    needs: [test, upstreams, patch-guard, dawgs]
    runs-on: ubuntu-latest
    steps:
      - name: Every job this one needs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
