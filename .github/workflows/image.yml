name: image
on:
  workflow_dispatch:
    inputs:
      upstream_tag: { description: "BloodHound release tag, e.g. v9.6.0", required: true }
  schedule:
    - cron: "17 6 * * 1"   # weekly: build any new upstream release not yet published
permissions:
  contents: read
  packages: write
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      # `docker manifest inspect` below decides whether a tag still needs
      # building. Without credentials a private package looks like a missing
      # one, so every run would rebuild everything.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          if [ -n "$UPSTREAM_TAG" ]; then
            echo "tags=[\"$UPSTREAM_TAG\"]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Latest stable (non-rc) upstream releases not yet in GHCR for this repo.
          latest=$(gh release list -R SpecterOps/BloodHound --limit 20 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease|not) | .tagName] | .[0:3]')
          missing="[]"
          for t in $(echo "$latest" | jq -r '.[]'); do
            if ! docker manifest inspect "ghcr.io/mihhailsokolov/bloodhound-bloodtrail:$t" >/dev/null 2>&1; then
              missing=$(echo "$missing" | jq -c --arg t "$t" '. + [$t]')
            fi
          done
          echo "tags=$missing" >> "$GITHUB_OUTPUT"
  build:
    needs: discover
    if: needs.discover.outputs.tags != '[]'
    runs-on: ubuntu-latest
    strategy:
      # One tag's transient failure (a flaky registry or sumdb fetch) must
      # not cancel the other tags' builds -- each tag publishes on its own.
      fail-fast: false
      matrix:
        upstream_tag: ${{ fromJson(needs.discover.outputs.tags) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          UPSTREAM_TAG: ${{ matrix.upstream_tag }}
        run: ./build/build-image.sh "$UPSTREAM_TAG" "$(git describe --tags --always)" --push --platform linux/amd64,linux/arm64
