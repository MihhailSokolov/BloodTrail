name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # A released CLI installs exactly <upstream>-bt<its own version> and never
  # falls back to the moving <upstream> alias (which the weekly image builds
  # republish from main), so those exact images have to exist before the CLI
  # does. Built here, from this tag's own ref, which is what stamps the
  # version. The upstream list is build/upstream-tags.sh's, the same one
  # ci.yml's patch guard checks.
  # Without timeout-minutes a hung step runs for GitHub's default 360 minutes,
  # holding a release half-published: the images exist but the CLI that pins
  # them does not, which is the state a released CLI cannot install from. The
  # bounds come from this workflow's own past runs -- `upstreams` is a release
  # list that has never reached a minute, `goreleaser` has taken at most 2
  # minutes over three runs -- and are set well above them, because a bound
  # that trips on a slow-but-working release is worse than none. `images`
  # cannot carry one: a job that calls a reusable workflow may not set
  # timeout-minutes, so image.yml bounds its own jobs instead.
  upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        # Assigned before it is echoed: `echo "tags=$(cmd)"` reports echo's
        # status, so a failing upstream-tags.sh used to pass this step with an
        # empty list, and the images matrix then died on fromJson('').
        run: |
          tags=$(./build/upstream-tags.sh)
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
  images:
    needs: upstreams
    strategy:
      fail-fast: false
      matrix:
        upstream: ${{ fromJson(needs.upstreams.outputs.tags) }}
    uses: ./.github/workflows/image.yml
    with:
      upstream_tag: ${{ matrix.upstream }}
    permissions:
      contents: read
      packages: write
  goreleaser:
    needs: [upstreams, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The installer a release ships is useless if the images it asks for
      # cannot be pulled anonymously (first-release checklist,
      # build/README.md): refuse to publish a CLI until every
      # version-stamped image it will request is publicly pullable -- the
      # exact tags, not the moving alias, which says nothing about this
      # release.
      - name: Verify this release's images are anonymously pullable
        env:
          UPSTREAM_TAGS: ${{ join(fromJson(needs.upstreams.outputs.tags), ' ') }}
        run: |
          docker logout ghcr.io 2>/dev/null || true
          version="${GITHUB_REF_NAME#v}"
          for upstream in $UPSTREAM_TAGS; do
            image="ghcr.io/mihhailsokolov/bloodtrail:${upstream}-bt${version}"
            docker manifest inspect "$image" > /dev/null || { echo "::error::$image is not anonymously pullable"; exit 1; }
          done
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
