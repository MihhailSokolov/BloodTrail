version: 2
project_name: bloodtrail
builds:
  - id: bloodtrail
    main: ./cmd/bloodtrail
    binary: bloodtrail
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
release:
  # A tag with a semver prerelease suffix (v0.2.0-rc.1) is published as a
  # GitHub prerelease. release.yml releases every v* tag, and without this an
  # RC would become the "latest" release, which is what scripts/install.sh
  # (releases/latest/download) fetches.
  prerelease: auto
  extra_files:
    - glob: scripts/install.sh
changelog:
  use: github
