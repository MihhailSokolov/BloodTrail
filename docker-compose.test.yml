services:
  test-db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: bloodtrail
      POSTGRES_PASSWORD: bloodtrail
      POSTGRES_DB: bloodtrail
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodtrail -d bloodtrail"]
      interval: 5s
      timeout: 3s
      retries: 20
